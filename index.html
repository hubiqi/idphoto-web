<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 证件照</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --line:#e6eaf2; --txt:#1b2130; --dim:#6b7688;
    --accent:#2f6bff; --accent2:#1f4fd8; --ok:#12b76a; --warn:#f79009; --err:#f04438;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt); font-size:15px; line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    padding:16px 14px 40px;
  }
  .wrap{max-width:560px;margin:0 auto}
  header{text-align:center;padding:6px 0 14px}
  header h1{margin:0;font-size:22px;letter-spacing:.5px}
  header p{margin:6px 0 0;color:var(--dim);font-size:13px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .card h2{margin:0 0 10px;font-size:14px;color:var(--dim);font-weight:600}
  .uploader{
    position:relative;border:1.5px dashed #c8d2e6;border-radius:14px;background:#fafbff;
    min-height:190px;display:flex;align-items:center;justify-content:center;
    text-align:center;cursor:pointer;overflow:hidden;transition:.15s;
  }
  .uploader:active{border-color:var(--accent);background:#f2f6ff}
  .uploader .ico{font-size:34px;line-height:1}
  .uploader .t{margin-top:8px;font-weight:600}
  .uploader .s{color:var(--dim);font-size:12px;margin-top:4px}
  #preview{display:none;width:100%;max-height:320px;object-fit:contain;background:#eef1f7}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:10px;
    padding:8px 12px;font-size:13px;cursor:pointer;transition:.12s;user-select:none;
  }
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .swatch{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);display:inline-block;vertical-align:-6px}
  .chip.col[aria-pressed="true"]{background:#eef3ff;border-color:var(--accent);color:var(--txt)}
  .chip.col[aria-pressed="true"] .swatch{box-shadow:0 0 0 2px var(--accent)}
  .custom{display:flex;gap:8px;align-items:flex-end;margin-top:12px;flex-wrap:wrap}
  .custom label{flex:1;min-width:88px;font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:4px}
  .custom input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fbfcff}
  .mini{padding:9px 14px;border-radius:10px;border:1px solid var(--accent);background:#fff;color:var(--accent);font-size:13px;font-weight:600}
  details summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--dim);list-style:none}
  details summary::-webkit-details-marker{display:none}
  details summary:before{content:"▸ ";color:var(--accent)}
  details[open] summary:before{content:"▾ "}
  .field{margin-top:12px}
  .field .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-bottom:4px}
  input[type=range]{width:100%;accent-color:var(--accent)}
  select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fbfcff;font-size:14px}
  .switch{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:13px}
  .switch input{width:18px;height:18px;accent-color:var(--accent)}
  .primary{
    width:100%;padding:15px;border:0;border-radius:14px;font-size:16px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));cursor:pointer;
    box-shadow:0 6px 18px rgba(47,107,255,.28);margin:4px 0 14px;
  }
  .primary:disabled{background:#c3cbd9;box-shadow:none;cursor:not-allowed}
  .primary.busy{background:linear-gradient(135deg,#7aa2ff,#5f86e8)}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
  .tab{
    flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
    background:#fff;font-size:13px;cursor:pointer;white-space:nowrap;
  }
  .tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .stage{background:#eef1f7;border-radius:12px;padding:10px;display:flex;justify-content:center;min-height:180px;align-items:center}
  .stage img{max-width:100%;max-height:52vh;border-radius:6px;box-shadow:0 2px 10px rgba(16,24,40,.12);background:
    linear-gradient(45deg,#e9edf5 25%,transparent 25%,transparent 75%,#e9edf5 75%),
    linear-gradient(45deg,#e9edf5 25%,#fff 25%,#fff 75%,#e9edf5 75%);background-size:16px 16px;background-position:0 0,8px 8px}
  .meta{color:var(--dim);font-size:12px;margin:10px 0 12px;text-align:center}
  .dl,.dl2{
    display:block;text-align:center;padding:13px;border-radius:12px;font-weight:700;text-decoration:none;
    background:var(--ok);color:#fff;font-size:15px;
  }
  .dl2{background:#fff;color:var(--accent);border:1px solid var(--accent);margin-top:8px;font-weight:600}
  .note{color:var(--dim);font-size:12px;margin-top:12px;text-align:center}
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:rgba(27,33,48,.94);color:#fff;
    padding:11px 16px;border-radius:12px;font-size:13px;max-width:86vw;text-align:center;
    opacity:0;pointer-events:none;transition:.25s;z-index:99;
  }
  .toast.show{opacity:1}
  .toast.err{background:rgba(240,68,56,.96)}
  .spin{width:15px;height:15px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;
    display:inline-block;vertical-align:-2px;margin-right:8px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .card.off{border-color:#f0c9c9;background:#fff8f8}
  .off-t{font-weight:600;color:#c0392b;margin-bottom:4px}
  .off-s{font-size:13px;color:var(--muted);margin-bottom:10px}
  .off-r{display:flex;gap:10px;flex-wrap:wrap}
  .mini.ghost{background:#fff;color:#c0392b;border:1px solid #f0c9c9;text-decoration:none;
    display:inline-flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🪪 AI 证件照</h1>
    <p>上传照片 → 自动抠图换底色 → 输出标准证件照</p>
  </header>

  <section class="card">
    <h2>0. 上传照片</h2>
    <div class="uploader" id="uploader">
      <input type="file" id="file" accept="image/*" hidden>
      <div id="hint">
        <div class="ico">📷</div>
        <div class="t">点击选择照片</div>
        <div class="s">正面免冠、光线均匀，单人清晰照效果最佳</div>
      </div>
      <img id="preview" alt="">
    </div>
  </section>

  <section class="card">
    <h2>1. 选择尺寸</h2>
    <div class="chips" id="sizes"></div>
    <div class="custom">
      <label>宽 (px)<input id="cw" type="number" inputmode="numeric" placeholder="295"></label>
      <label>高 (px)<input id="ch" type="number" inputmode="numeric" placeholder="413"></label>
      <button class="mini" id="useCustom">自定义</button>
    </div>
  </section>

  <section class="card">
    <h2>2. 选择底色</h2>
    <div class="chips" id="colors"></div>
  </section>

  <section class="card">
    <details id="adv">
      <summary>高级选项</summary>
      <div class="switch"><span>自动摆正头部</span><input type="checkbox" id="align" checked></div>
      <div class="field">
        <div class="lab"><span>美白</span><span id="v-whitening">0</span></div>
        <input type="range" id="whitening" min="0" max="20" value="0">
      </div>
      <div class="field">
        <div class="lab"><span>亮度</span><span id="v-brightness">0</span></div>
        <input type="range" id="brightness" min="-20" max="20" value="0">
      </div>
      <div class="field">
        <div class="lab"><span>对比度</span><span id="v-contrast">0</span></div>
        <input type="range" id="contrast" min="-20" max="20" value="0">
      </div>
      <div class="field">
        <div class="lab"><span>饱和度</span><span id="v-saturation">0</span></div>
        <input type="range" id="saturation" min="-20" max="20" value="0">
      </div>
      <div class="field">
        <div class="lab"><span>锐化</span><span id="v-sharpen">0</span></div>
        <input type="range" id="sharpen" min="0" max="20" value="0">
      </div>
      <div class="field">
        <div class="lab"><span>抠图模型</span></div>
        <select id="matting">
          <option value="hivision_modnet">hivision_modnet（快，推荐）</option>
          <option value="modnet_photographic_portrait_matting">MODNet 通用版</option>
        </select>
      </div>
    </details>
  </section>

  <button class="primary" id="go" disabled>生成证件照</button>

  <section class="card" id="result" hidden>
    <h2>3. 结果</h2>
    <div class="tabs" id="tabs"></div>
    <div class="stage"><img id="out" alt=""></div>
    <div class="meta" id="meta"></div>
    <a class="dl" id="dl" download="idphoto.png">下载当前图片</a>
    <a class="dl2" id="dlall">下载全部（依次保存）</a>
  </section>

  <div class="note">照片会上传到服务器做抠图与裁切，处理完即丢弃，不落盘、不留存。</div>
  <div class="card off" id="offline" hidden>
    <div class="off-t">暂时连不上证件照服务</div>
    <div class="off-s">隧道可能正在重启，稍等片刻重试即可。</div>
    <div class="off-r">
      <button class="mini" id="retry">重试连接</button>
      <a class="mini ghost" id="fallback" href="#">打开备用入口</a>
    </div>
  
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
